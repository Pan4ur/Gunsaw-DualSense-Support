<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GunsawDualSenseSupport</title>
<style>
    :root{color-scheme:dark;font:16px system-ui;background:#141619;color:#ecede9}
    main{max-width:900px;margin:3rem auto;padding:0 1rem}
    h1{font-size:2rem}
    section{background:#21252a;border:1px solid #33383e;padding:1rem;border-radius:10px;margin:1rem 0}
    .controls{display:flex;flex-wrap:wrap;gap:8px}
    button,label{font:inherit}
    button{background:#333942;border:1px solid #607080;color:inherit;border-radius:6px;padding:.6rem;touch-action:none;user-select:none}
    button.active{background:#247384}
    .surface{touch-action:none;user-select:none;width:145px;height:145px;border:1px solid #607080;border-radius:50%;position:relative;background:#181b1d;display:grid;place-items:center;color:#bfc7cc}
    .surface i{pointer-events:none;background:#8bdfe5;border-radius:50%;width:16px;height:16px;position:absolute;inset:calc(50% - 8px)}
    #touch{width:min(260px,95%);border-radius:9px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
    output{font-variant-numeric:tabular-nums;color:#8bdfe5}
    meter{display:block;width:100%}
</style>
<main>
    <h1>GunsawDualSenseSupport Emulator</h1>
    <p>Run the game with [Emulator] Enabled = true</p>
    <section>
        <div class="controls" id="buttons"></div>
    </section>
    <section class="grid">
        <div class="surface" id="left" aria-label="Left stick">Left stick<i></i></div>
        <div class="surface" id="right" aria-label="Right stick">Right stick<i></i></div>
        <div class="surface" id="touch" aria-label="Tap touchpad">Tap touchpad<i></i></div>
        <label>L2 <input id="l2" type="range" min="0" max="255" value="0"></label>
        <label>R2 <input id="r2" type="range" min="0" max="255" value="0"></label>
    </section>
    <section aria-live="polite">
        <p>Игра
            <output id="game">Awaiting game</output>
        </p>
        <div class="grid">
            <label>L2
                <output id="leftForce">0 / 8</output>
                <meter id="leftMeter" min="0" max="8" value="0"></meter>
            </label>
            <label>R2
                <output id="rightForce">0 / 8</output>
                <meter id="rightMeter" min="0" max="8" value="0"></meter>
            </label>
            <label>Vibro
                <output id="rumble">0 / 0</output>
                <meter id="rumbleMeter" min="0" max="1" value="0"></meter>
            </label>
            <label>Speaker
                <output id="sound">—</output>
            </label>
        </div>
        <button id="reset">Release all</button>
    </section>
</main>
<script>
    const $ = id => document.getElementById(id);
    const buttons = [
        [0,"Cross","Space"], [1,"Circle","KeyC"], [2,"Square","KeyB"], [3,"Triangle","KeyE"],
        [4,"Share","Digit0"], [6,"Options","Escape"], [7,"L3","KeyN"], [8,"R3","KeyM"],
        [9,"L1","KeyQ"], [10,"R1","KeyR"], [11,"↑","ArrowUp"], [12,"↓","ArrowDown"],
        [13,"←","ArrowLeft"], [14,"→","ArrowRight"], [20,"Tap touchpad","KeyT"]
    ];
    const axes = new Uint8Array([128,128,128,128,0,0,0,0,0]);
    const keys = new Set();
    let held = 0, latched = 0, busy = false;
    for (const [id, name, key] of buttons) {
        const button = document.createElement("button");
        button.textContent = name + " (" + key.replace(/^Key|^Digit/, "") + ")";
        button.dataset.bit = 1 << id;
        const hold = document.createElement("input");
        hold.type = "checkbox";
        hold.setAttribute("aria-label", "Hold " + name);
        hold.onchange = () => { if (hold.checked) latched |= 1 << id; else latched &= ~(1 << id); };
        button.onpointerdown = e => { button.setPointerCapture(e.pointerId); held |= 1 << id; };
        button.onlostpointercapture = () => held &= ~(1 << id);
        const group = document.createElement("span");
        group.append(button, hold);
        $("buttons").append(group);
    }
    function surface(element, index, touch) {
        function move(e) {
            const r = element.getBoundingClientRect();
            const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
            const y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
            if (touch) axes[6] = 1;
            axes[index] = Math.round(x * 255);
            axes[index + 1] = Math.round((touch ? y : 1 - y) * 255);
            element.querySelector("i").style.transform = `translate(${(x - .5) * r.width}px,${(y - .5) * r.height}px)`;
        }
        element.onpointerdown = e => { element.setPointerCapture(e.pointerId); move(e); };
        element.onpointermove = e => { if (element.hasPointerCapture(e.pointerId)) move(e); };
        element.onlostpointercapture = () => {
            if (touch) axes[6] = 0;
            else axes[index] = axes[index + 1] = 128;
            element.querySelector("i").style.transform = "";
        };
    }
    surface($("left"), 0, false);
    surface($("right"), 2, false);
    surface($("touch"), 7, true);
    window.addEventListener("keydown", e => {
        if (e.target.matches("input")) return;
        if (buttons.some(b => b[2] === e.code) || /^(Key[WASDFG]|Key[IJKL])$/.test(e.code)) {
            e.preventDefault();
            keys.add(e.code);
        }
    });
    window.addEventListener("keyup", e => keys.delete(e.code));
    window.addEventListener("blur", () => { keys.clear(); held = 0; });
    $("reset").onclick = () => {
        keys.clear();
        held = latched = 0;
        $("l2").value = $("r2").value = 0;
        document.querySelectorAll('input[type="checkbox"]').forEach(input => input.checked = false);
    };
    function axis(negative, positive, fallback) {
        if (keys.has(negative) === keys.has(positive)) return fallback;
        return keys.has(negative) ? 0 : 255;
    }
    function show(value) {
        const [l=0,r=0,breakPoint=0,lo=0,hi=0,engine=0,heart=0,locator=0,...game] = value ? value.split(" ") : [];
        $("game").textContent = game.join(" ") || "awaiting game";
        $("leftForce").textContent = l + " / 8";
        $("rightForce").textContent = r + " / 8" + (breakPoint > 0 ? " | break point " + breakPoint + "%" : "");
        $("rumble").textContent = lo + " / " + hi;
        $("leftMeter").value = l;
        $("rightMeter").value = r;
        $("rumbleMeter").value = Math.max(lo, hi);
        $("sound").textContent = "Engine " + engine + " | Heart " + heart + " | Locator " + locator;
    }
    setInterval(async () => {
        if (busy) return;
        let bits = held | latched;
        for (const [id,,key] of buttons) if (keys.has(key)) bits |= 1 << id;
        document.querySelectorAll("[data-bit]").forEach(b => b.classList.toggle("active", Boolean(bits & Number(b.dataset.bit))));
        const packet = new Uint8Array([bits, bits >> 8, bits >> 16,
            axis("KeyA","KeyD",axes[0]), axis("KeyS","KeyW",axes[1]),
            axis("KeyJ","KeyL",axes[2]), axis("KeyK","KeyI",axes[3]),
            keys.has("KeyF") ? 255 : +$("l2").value, keys.has("KeyG") ? 255 : +$("r2").value, axes[6], axes[7], axes[8]]);
        busy = true;
        try {
            const response = await fetch("/pad", {method:"POST",body:packet,signal:AbortSignal.timeout(300)});
            show(await response.json());
        } catch { show(""); } finally { busy = false; }
    }, 35);
</script>
